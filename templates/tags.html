{% extends 'base.html' %}{% block content %}<div class="pagehead"><div class="eyebrow">Справочник</div><h1>RFID/NFC-метки</h1></div><div class="toolbar"><form class="search" method="get"><input name="q" value="{{request.args.get('q','')}}" placeholder="UID, ученик, класс"><button>Найти</button></form><a class="button" href="{{url_for('tag_form')}}">Добавить</a></div><div class="tablewrap"><table><tr><th>UID</th><th>Статус</th><th>Учащийся</th><th>Класс</th><th></th></tr>{% for r in rows %}<tr><td><b>{{r[1]}}</b></td><td>{{r[2]}}</td><td>{{r[4]}} {{r[5]}}</td><td>{{r[6]}}</td><td><a href="{{url_for('tag_form',item_id=r[0])}}">Изменить</a></td></tr>{% endfor %}</table></div>{% endblock %}
