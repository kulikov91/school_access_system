{% extends 'base.html' %}{% block content %}<div class="pagehead"><h1>{{'Изменение' if row else 'Добавление'}} учащегося</h1></div><form class="panel formgrid" method="post"><label>Фамилия*<input name="last_name" required value="{{row[1] if row else ''}}"></label><label>Имя*<input name="first_name" required value="{{row[2] if row else ''}}"></label><label>Отчество<input name="middle_name" value="{{row[3] or '' if row else ''}}"></label><label>Класс*<input name="class_name" required value="{{row[4] if row else ''}}"></label><div><button>Сохранить</button> <a href="{{url_for('students')}}">Отмена</a></div></form>{% endblock %}
