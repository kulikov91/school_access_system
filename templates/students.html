{% extends 'base.html' %}{% block title %}Учащиеся{% endblock %}{% block content %}<div class="pagehead"><div class="eyebrow">Справочник</div><h1>Учащиеся</h1></div><div class="toolbar"><form class="search" method="get"><input name="q" value="{{ request.args.get('q','') }}" placeholder="Фамилия, класс"><button>Найти</button></form><a class="button" href="{{ url_for('student_form') }}">Добавить</a></div><div class="tablewrap"><table><tr><th>ID</th><th>ФИО</th><th>Класс</th><th></th></tr>{% for r in rows %}<tr><td>{{r[0]}}</td><td>{{r[1]}} {{r[2]}} {{r[3] or ''}}</td><td>{{r[4]}}</td><td><a href="{{ url_for('student_form',item_id=r[0]) }}">Изменить</a>{% if session.user.role in ['sysadmin','director'] %}<form class="inline" method="post" action="{{ url_for('student_delete',item_id=r[0]) }}"><button class="link danger" onclick="return confirm('Удалить учащегося?')">Удалить</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
