{% extends 'base.html' %}{% block content %}<div class="pagehead"><div class="eyebrow">Справочник</div><h1>Родители</h1></div><div class="toolbar"><form class="search" method="get"><input name="q" value="{{request.args.get('q','')}}" placeholder="ФИО, телефон, e-mail"><button>Найти</button></form><a class="button" href="{{url_for('parent_form')}}">Добавить</a></div><div class="tablewrap"><table><tr><th>ФИО</th><th>Телефон</th><th>E-mail</th><th></th></tr>{% for r in rows %}<tr><td>{{r[1]}} {{r[2]}} {{r[3] or ''}}</td><td>{{r[4]}}</td><td>{{r[5]}}</td><td><a href="{{url_for('parent_form',item_id=r[0])}}">Изменить</a>{% if session.user.role in ['sysadmin','director'] %}<form class="inline" method="post" action="{{url_for('parent_delete',item_id=r[0])}}"><button class="link danger" onclick="return confirm('Удалить родителя?')">Удалить</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
