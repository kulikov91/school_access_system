{% extends 'base.html' %}{% block content %}<div class="pagehead"><h1>{{'Изменение' if row else 'Добавление'}} метки</h1></div><form class="panel formgrid" method="post"><label>UID*<input name="uid" required value="{{row[1] if row else ''}}"></label><label>Статус<select name="status"><option value="active" {% if not row or row[2]=='active' %}selected{% endif %}>active</option><option value="blocked" {% if row and row[2]=='blocked' %}selected{% endif %}>blocked</option></select></label><label>Учащийся*<select name="id_student" required>{% for s in students %}<option value="{{s[0]}}" {% if row and row[3]==s[0] %}selected{% endif %}>{{s[1]}} {{s[2]}} — {{s[4]}}</option>{% endfor %}</select></label><div><button>Сохранить</button> <a href="{{url_for('tags')}}">Отмена</a></div></form>{% endblock %}
